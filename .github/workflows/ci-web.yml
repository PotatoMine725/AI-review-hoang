name: CI web

on:
  pull_request:
    paths:
      - "fe/**"
      - ".github/workflows/ci-web.yml"
  push:
    branches: [main]
    paths:
      - "fe/**"
      - ".github/workflows/ci-web.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: eslint + tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version đọc từ "packageManager" trong fe/package.json
        with:
          package_json_file: fe/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Sinh type cho route (LayoutProps, PageProps...) trước khi type-check
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

<!--
  Layout "stat": một con số / từ khoá lớn nổi bật, kèm minh hoạ theo nghĩa.
  props: eyebrow{text}, value{text}, label{text,highlight}, visual{icon, badge_icon}, chips[]
  Lớp hiện dần: minh hoạ (0 s) → eyebrow (0,25) → giá trị (0,45, slam) → nhãn (0,7) → chip (0,95 + i×0,25)
-->
<div class="scene layout-stat" data-layout="stat">
  <style>
    .layout-stat .safe { display: grid; align-items: center; }
    .layout-stat.is-portrait .safe { grid-template-rows: 1fr auto; gap: 60px; }
    .layout-stat.is-landscape .safe { grid-template-columns: 0.8fr 1.2fr; gap: 90px; }
    .layout-stat .illo { position: relative; justify-self: center; display: grid; place-items: center; }
    .layout-stat.is-portrait .illo { width: 680px; height: 680px; }
    .layout-stat.is-landscape .illo { width: 600px; height: 600px; }
    /* Vòng tròn đồng tâm xoay chậm phía sau minh hoạ */
    .layout-stat .rings { position: absolute; inset: 0; animation: ring-spin 24s linear both; }
    .layout-stat .rings circle { fill: none; stroke: var(--accent-2); stroke-opacity: 0.25; stroke-width: 1.5; }
    .layout-stat .rings circle:nth-child(2) { stroke: var(--accent); stroke-dasharray: 6 14; stroke-opacity: 0.5; }
    /* Cửa sổ trình duyệt thu nhỏ chứa icon: "chạy ngay trong trình duyệt" */
    .layout-stat .mini { position: relative; width: 62%; aspect-ratio: 1.15; }
    /* overflow visible: huy hiệu ló ra ngoài góc khung (.browser mặc định cắt). Bo góc thanh tay. */
    .layout-stat .mini.browser { overflow: visible; }
    .layout-stat .mini .bar { height: 54px; border-radius: 28px 28px 0 0; }
    .layout-stat .mini .body { display: grid; place-items: center; height: calc(100% - 54px); color: var(--accent-2); }
    .layout-stat .mini .body svg { width: 46%; height: 46%; stroke-width: 1.4; }
    .layout-stat .badge { position: absolute; right: -34px; top: -34px; width: 120px; height: 120px;
      border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent);
      box-shadow: 0 16px 40px rgba(0,0,0,.5); }
    .layout-stat .badge svg { width: 60%; height: 60%; stroke-width: 2.6; }
    .layout-stat .copy { display: flex; flex-direction: column; gap: 26px; }
    .layout-stat.is-portrait .copy { align-items: center; text-align: center; }
    .layout-stat .value { font-weight: 800; font-size: var(--fs-stat); line-height: 0.95; letter-spacing: -0.04em;
      background: linear-gradient(180deg, #ffe2a3 0%, var(--accent) 70%); -webkit-background-clip: text;
      background-clip: text; color: transparent; padding-bottom: 0.06em; }
    .layout-stat .stat-label { font-size: var(--fs-body); font-weight: 700; color: var(--ink); line-height: 1.3; --hl-d: 1.1s; }
    .layout-stat.is-portrait .chips { justify-content: center; }
  </style>

  <div class="bg"></div>
  <div class="bg-dots"></div>
  <div class="orb orb-a"></div>
  <div class="orb orb-c"></div>

  <div class="safe">
    <div class="illo a-pop" style="--d: 0s">
      <svg class="rings" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="98" /><circle cx="100" cy="100" r="80" /><circle cx="100" cy="100" r="62" />
      </svg>
      <div class="mini browser">
        <div class="bar"><i></i><i></i><i></i></div>
        <div class="body" data-icon="visual.icon"></div>
        <div class="badge a-pop" style="--d: 0.6s" data-icon="visual.badge_icon"></div>
      </div>
    </div>
    <div class="copy">
      <div class="eyebrow a-rise" style="--d: 0.25s" data-text="eyebrow"></div>
      <div class="value a-slam" style="--d: 0.45s" data-text="value"></div>
      <div class="stat-label a-rise" style="--d: 0.7s" data-text="label"></div>
      <div class="chips" data-list="chips">
          <span data-item class="chip a-pop" style="--d: calc(0.95s + var(--i) * var(--stagger))">
            <span data-icon="icon"></span><span data-text="text"></span>
          </span>
      </div>
    </div>
  </div>

  <script>window.TPL.mount("stat");</script>
</div>

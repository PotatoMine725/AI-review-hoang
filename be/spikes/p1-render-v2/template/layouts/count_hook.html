<!--
  Layout "count_hook" (template đếm ngược): tiêu đề chữ đậm to ở trên, ảnh trong khung viền đen,
  tên sản phẩm là nhãn dán. Cùng props với "hook".
  props: brand{text,icon}, kicker{text,icon}, title{text,highlight}, chips[{text,icon,at}], image{src,label}
-->
<div class="scene layout-count-hook" data-layout="count_hook">
  <style>
    .layout-count-hook .safe { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 36px; }
    .layout-count-hook .title { font-family: var(--font-display); font-weight: 400; text-transform: uppercase;
      line-height: 1.04; --wd: 0.1s; --w-step: 0.08s; --hl-d: 1.1s; }
    .layout-count-hook.is-portrait .title { font-size: 120px; }
    .layout-count-hook.is-landscape .safe { flex-direction: row; text-align: left; align-items: center; gap: 70px; }
    .layout-count-hook.is-landscape .copy { flex: 1; align-items: flex-start; }
    .layout-count-hook.is-landscape .title { font-size: 118px; }
    .layout-count-hook .copy { display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .layout-count-hook .kicker { font-weight: 800; font-size: var(--fs-chip); letter-spacing: 0.06em; text-transform: uppercase; }
    .layout-count-hook .shot { position: relative; flex: none; }
    .layout-count-hook.is-portrait .shot { width: 860px; height: 560px; }
    .layout-count-hook.is-landscape .shot { width: 760px; height: 560px; }
    .layout-count-hook .bframe { position: absolute; inset: 0; }
    .layout-count-hook .bframe img { width: 100%; height: calc(100% - 44px); object-fit: cover; display: block; }
    .layout-count-hook .ai-label { position: absolute; left: 22px; bottom: 18px; z-index: 2; font-size: 24px; font-weight: 700;
      background: #fff; color: #111; border: 3px solid #111; padding: 4px 12px; border-radius: 8px; }
    .layout-count-hook .brand-tag { position: absolute; right: -28px; bottom: -34px; z-index: 3; font-size: 54px; }
    .layout-count-hook .tags { position: absolute; left: -26px; top: 70px; z-index: 3; }
    .layout-count-hook .tags .sticker { position: absolute; left: 0; top: 0; font-size: 40px; white-space: nowrap; }
    .layout-count-hook .tags .sticker { --beat: 999s; }
  </style>

  <div class="bg"></div>
  <div class="bg-dots"></div>

  <div class="safe">
    <div class="copy">
      <h1 class="title" data-words data-text="title"></h1>
      <div class="kicker a-rise" style="--d: 0.7s" data-if="kicker"><span data-text="kicker"></span></div>
    </div>
    <figure class="shot a-drop" style="--d: 0.45s; margin: 0">
      <div class="bframe">
        <div class="bar"><i></i><i></i><i></i></div>
        <img class="kenburns" data-src="image.src" alt="" />
      </div>
      <figcaption class="ai-label" data-if="image.label" data-text="image.label"></figcaption>
      <div class="brand-tag sticker is-yellow a-pop" style="--d: 0.9s">
        <span data-icon="brand.icon"></span><span data-text="brand"></span>
      </div>
      <div class="tags" data-list="chips" data-beat-from="2">
        <span data-item class="sticker beat-swap"><span data-icon="icon"></span><span data-text="text"></span></span>
      </div>
    </figure>
  </div>

  <script>window.TPL.mount("count_hook");</script>
</div>

<!--
  Layout "hook": 0–2 s đầu phải có tên sản phẩm + chuyển động mạnh, kèm minh hoạ (ảnh AI).
  props: brand{text,icon}, kicker{text,icon}, title{text,highlight}, chips[{text,icon,accent}],
         image{src,label}
  Lớp hiện dần: logo (0 s, slam) → kicker (0,3) → tiêu đề (0,55) → ảnh (0,8) → chip (1,1 + i×0,25)
-->
<div class="scene layout-hook" data-layout="hook">
  <style>
    .layout-hook .safe { display: grid; gap: 44px; }
    .layout-hook.is-portrait .safe { grid-template-rows: auto 1fr; }
    .layout-hook.is-landscape .safe { grid-template-columns: 1.05fr 0.95fr; align-items: center; gap: 72px; }
    .layout-hook .copy { display: flex; flex-direction: column; gap: 34px; align-items: flex-start; }
    .layout-hook .title { --hl-d: 1.2s; }
    .layout-hook.is-portrait .title { font-size: 100px; }
    .layout-hook .visual { position: relative; margin: 0; min-height: 0; }
    .layout-hook .frame { position: absolute; inset: 0; overflow: hidden; border-radius: var(--radius-card);
      border: 1px solid var(--surface-line); box-shadow: var(--shadow-card); }
    .layout-hook.is-landscape .visual { height: 720px; }
    .layout-hook .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* Viền sáng màu nhấn quanh ảnh */
    .layout-hook .frame::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
      box-shadow: inset 0 0 0 2px rgba(244, 183, 64, 0.35), inset 0 -180px 160px -60px rgba(8, 11, 20, 0.85); }
    .layout-hook .ai-label { position: absolute; left: 28px; bottom: 24px; z-index: 2; font-size: 26px;
      font-weight: 700; color: var(--ink-muted); background: rgba(8, 11, 20, 0.7); padding: 8px 18px;
      border-radius: 999px; }
    .layout-hook .tags { position: absolute; right: 28px; top: 28px; z-index: 2; display: flex;
      flex-direction: column; gap: 16px; align-items: flex-end; }
  </style>

  <div class="bg"></div>
  <div class="bg-dots"></div>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <svg class="waves" viewBox="0 0 1000 300" preserveAspectRatio="none">
    <path d="M0 200 C 150 120 300 280 500 190 S 850 110 1000 180" />
    <path d="M0 240 C 180 170 320 300 520 230 S 860 160 1000 220" />
    <path d="M0 160 C 200 90 340 230 540 150 S 880 80 1000 140" />
  </svg>

  <div class="safe">
    <div class="copy">
      <div class="brand a-slam shine" style="--d: 0s; --shine-d: 0.55s">
        <span class="icon-tile" data-icon="brand.icon"></span>
        <span class="wordmark" data-text="brand"></span>
        <i class="shine-bar"></i>
      </div>
      <div class="chip is-cool a-rise" style="--d: 0.3s" data-if="kicker">
        <span data-icon="kicker.icon"></span><span data-text="kicker"></span>
      </div>
      <h1 class="title a-rise" style="--d: 0.55s; --wd: 0.55s" data-words data-text="title"></h1>
    </div>
    <figure class="visual a-rise-big" style="--d: 0.8s">
      <div class="frame"><img class="kenburns" data-src="image.src" alt="" /></div>
      <figcaption class="ai-label" data-text="image.label"></figcaption>
      <div class="tags" data-list="chips">
          <span data-item class="chip a-pop" style="--d: calc(1.1s + var(--i) * var(--stagger))">
            <span data-icon="icon"></span><span data-text="text"></span>
          </span>
      </div>
    </figure>
  </div>

  <script>window.TPL.mount("hook");</script>
</div>

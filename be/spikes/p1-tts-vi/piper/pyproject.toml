[project]
name = "p1-tts-piper"
version = "0.1.0"
description = "Spike P1-02b: ứng viên Piper vi_VN (môi trường riêng)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "tts-common",
    "piper-tts",
]

[tool.uv]
package = false

[tool.uv.sources]
tts-common = { path = "../common", editable = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pyright>=1.1.380"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["."]
exclude = [".venv", "models", "output"]
pythonVersion = "3.12"

[tool.ruff.lint.isort]
known-first-party = ["adapter"]
